name: Drift

# Regenerates everything docsmith generates (banner, diagrams, CLI reference,
# project layout, example snippets) and fails if the result differs from
# what is committed, so hand edits to generated sections and forgotten
# `make generate` runs do not slip through.
#
# Kept apart from ci.yml because the triggers want to differ: a doc-only
# change still needs this check even if CI is later narrowed with path
# filters.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Generated docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pure Go generators: output is byte for byte reproducible.
      - name: Banner, diagrams, CLI reference and layout
        run: |
          go run ./internal/tools/genbanner
          go run ./internal/tools/gendiagram
          go run ./internal/tools/gendocs
          git diff --exit-code

      # freeze is not installed here: its SVGs can differ between machines,
      # so they are rendered locally and committed. genexamples reuses them
      # when they match their snippet and falls back to a code block when
      # they are stale, which changes the Markdown and fails this step.
      - name: Examples
        run: |
          make examples-check
