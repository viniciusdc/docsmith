      <feFlood flood-color="#58a6ff" flood-opacity="0.25" result="clr"/>
      <feComposite in="clr" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
